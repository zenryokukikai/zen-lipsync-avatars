<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEN-LipSync: Node から配信</title>
<style>body{font-family:system-ui,sans-serif;margin:16px} canvas{width:100%;max-width:640px;display:block;background:#000} button{font-size:16px;margin:8px 8px 0 0}</style>
<h1>全力 マリン（サーバーの CPU で作った映像を配信）</h1>
<canvas id="v" width="640" height="364"></canvas>
<button id="speak">話させる</button><button id="angry">怒り</button><button id="normal">ふつう</button>
<p id="out">つないでいます…</p>
<script type="module">
// JPEG frames are drawn when their time comes on the audio clock; audio chunks are scheduled back to back.
const v = document.getElementById('v'), g = v.getContext('2d'), out = document.getElementById('out');
const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/`);
ws.binaryType = 'arraybuffer';
let ctx = null, t0 = null, frames = [], shown = 0, late = 0;
window.__stats = { frames: 0, audio: 0, drawn: 0, late: 0 };
function clock() { return ctx ? (ctx.currentTime - t0) * 1000 : 0; }
ws.onmessage = async (e) => {
  if (typeof e.data === 'string') { const m = JSON.parse(e.data); out.textContent = `つながりました（${m.width}x${m.height}、${m.kernel}）`; return; }
  const b = new Uint8Array(e.data), kind = b[0], timeMs = new Float64Array(e.data.slice(1, 9))[0], body = e.data.slice(9);
  if (kind === 1) { window.__stats.frames++; frames.push({ timeMs, bmp: await createImageBitmap(new Blob([body], { type: 'image/jpeg' })) }); }
  else {
    window.__stats.audio++;
    if (!ctx) { ctx = new AudioContext({ sampleRate: 24000 }); t0 = ctx.currentTime + 0.3; } // 0.3 s jitter buffer
    const pcm = new Float32Array(body); const buf = ctx.createBuffer(1, pcm.length, 24000); buf.copyToChannel(pcm, 0);
    const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.start(t0 + timeMs / 1000);
  }
};
function draw() {
  const now = clock();
  while (frames.length && frames[0].timeMs <= now) {
    const f = frames.shift();
    if (now - f.timeMs > 80) { window.__stats.late++; f.bmp.close(); continue; }
    g.drawImage(f.bmp, 0, 0, v.width, v.height); f.bmp.close(); window.__stats.drawn++;
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
document.getElementById('speak').onclick = () => { ctx?.resume(); ws.send(JSON.stringify({ type: 'speak' })); };
document.getElementById('angry').onclick = () => ws.send(JSON.stringify({ type: 'idle', name: 'angry' }));
document.getElementById('normal').onclick = () => ws.send(JSON.stringify({ type: 'idle', name: 'normal' }));
</script>
